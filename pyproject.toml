[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actuallydone"
version = "1.6.1"
description = "把「做完了」变成一件可以被复核的事：完成门禁、假绿检测与项目健康度报告"
readme = "README.md"
requires-python = ">=3.11"          # tomllib 进标准库是 3.11
license = { text = "MIT" }
keywords = ["ai-agent", "quality-gate", "code-health", "cursor", "skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []                   # 刻意为零：钩子与 CI 里多一个依赖就多一处装不上

[project.scripts]
adone = "actuallydone.cli:main"
actuallydone = "actuallydone.cli:main"
adone-hook-mark-dirty = "actuallydone.hookrun:cmd_mark_dirty"
adone-hook-gate-guard = "actuallydone.hookrun:cmd_gate_guard"
adone-hook-commit-guard = "actuallydone.hookrun:cmd_commit_guard"

[tool.setuptools.packages.find]
include = ["actuallydone*"]

[tool.setuptools.package-data]
actuallydone = ["templates/**/*"]
