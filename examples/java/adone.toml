# Java / Maven 基线。复制到仓库根，按下面的目录约定改路径。
#
# 约定：
#   src/main、src/test                         单元测试，类名 *Test，不要叫 *ApiTest / *IT
#   src/test 里的 *ApiTest                     接口测试（MockMvc、RestAssured、Testcontainers）
#   src/test 里的 *IT                          端到端，由 failsafe 跑，不进 surefire
#   pom 的 surefire excludes                   **/*IT.java、**/*ApiTest.java
#   pom 的 failsafe includes                   **/*IT.java
#   .cursor/skills                             adone install 渲染的技能
#
# spotless、checkstyle、spotbugs 要在 pom 里配好插件。gitleaks、adone 要在 PATH 上。
# 没有外网、或不想下漏洞库时，把最后面注释掉的 dependency-check 继续留着。

version = 1

[project]
name = "java-service"
ecosystems = ["java"]
state_dir = ".adone"
material_dir = "adone"
skills_dir = ".cursor/skills"
source_encoding = "utf-8"

[gate]
# 多模块时把每个模块的 src 写进来，不要写 "."，否则 target/ 进树，每次打包回执都过期。
watch_roots = ["src"]
watch_exts = [".java"]
# 跑一次 adone gate hash，填一个略低于实际文件数的值。1 等于没有保护。
min_tree_files = 1
keep_receipts = 20
# 提交仍跑下面的全量。只有 Maven 多模块、并且接受「没变的模块继承上一份绿回执」时才改成 "affected"。
# commit_scope = "affected"

# 敏感信息。命中就非 0。扫工作区当前文件，不依赖 git 历史。
# 要收紧规则再加 --config .gitleaks.toml。
[[gate.step]]
name = "敏感信息"
cwd = "."
argv = ["gitleaks", "detect", "--source", ".", "--no-git", "--redact"]

# 格式。spotless 不通过时自己退出非 0，不要标 kind = "fmt"。
[[gate.step]]
name = "格式化"
cwd = "."
argv = ["mvn", "-B", "-ntp", "spotless:check"]

# 风格。规则在 pom 的 checkstyle 插件里，不在这里。
[[gate.step]]
name = "Checkstyle"
cwd = "."
argv = ["mvn", "-B", "-ntp", "checkstyle:check"]

# 空指针、资源没关这类缺陷。比 Checkstyle 慢，仍比测试快。
[[gate.step]]
name = "SpotBugs"
cwd = "."
argv = ["mvn", "-B", "-ntp", "spotbugs:check"]

# 技能正文：frontmatter、断链、引用的行号、超过 120 行只是警告。有错误才非 0。
[[gate.step]]
name = "技能检查"
cwd = "."
argv = ["adone", "health", "--only", "skills"]

# 单元测试 + 覆盖率。-Dtest 会盖掉 pom 的 includes，所以这里不写 -Dtest，靠 surefire excludes 排掉 IT 和 ApiTest。
# jacoco:prepare-agent 必须写在 test 前面。只写 test jacoco:report 时，没挂探针也会 BUILD SUCCESS。
[[gate.step]]
name = "单元测试"
cwd = "."
kind = "test"
adapter = "java"
timeout_seconds = 1800
# 套件在数据库没起来时自己往 stdout 打这四个字。不要写成 "Skipped"。
invalid_marks = ["整批跳过"]
argv = ["mvn", "-B", "-ntp", "jacoco:prepare-agent", "test", "jacoco:report"]

# 接口测试。确认 pom 的 excludes 没有把 *ApiTest 排掉，否则 -Dtest 选中的类仍会被排除。
# 不要再跑 jacoco:report，那会盖掉单元测试的报告，覆盖率就不是单元测试那一步的了。
[[gate.step]]
name = "API 测试"
cwd = "."
kind = "test"
adapter = "java"
timeout_seconds = 1800
invalid_marks = ["整批跳过"]
argv = ["mvn", "-B", "-ntp", "-Dtest=*ApiTest", "test"]

# 先打出端到端要启动的包。测试跳过，避免把单元测试再跑一遍。
[[gate.step]]
name = "打包"
cwd = "."
argv = ["mvn", "-B", "-ntp", "-DskipTests", "package"]

# 端到端。failsafe 报告在 target/failsafe-reports，java 适配器认。
[[gate.step]]
name = "端到端"
cwd = "."
kind = "test"
adapter = "java"
timeout_seconds = 3600
stall_seconds = 120
invalid_marks = ["整批跳过"]
argv = ["mvn", "-B", "-ntp", "failsafe:integration-test", "failsafe:verify"]

# 依赖漏洞。要外网，第一次会拉 NVD，很慢。准备好了再取消注释。
# [[gate.step]]
# name = "依赖漏洞"
# cwd = "."
# timeout_seconds = 3600
# argv = ["mvn", "-B", "-ntp", "org.owasp:dependency-check-maven:check"]

[coverage]
# 先跑一轮看实际数字，再把水位写进来。写了以后再调低要 adone policy --accept。
# threshold = 60
source = "单元测试"

[tests]
adapter = "java"
roots = ["."]
# 文档里写了覆盖率下限的，放进来，偷偷调低会被假绿检测抓住。
threshold_docs = []
# baseline_exempt = []

[code]
big_file_lines = 800
big_file_globs = ["src/**/*.java"]
mark_globs = ["src/**/*.java"]
mark_words = ["TODO", "FIXME", "XXX", "HACK"]
dup_min_lines = 8
dup_roots = ["src"]
zero_cover_ratio = 0.15

# [[code.unused]]
# name = "没人调用的包内方法"
# glob = "src/main/java/**/*.java"
# define = "^\\s+(?:public|protected|private)?\\s+[\\w<>, ?]+\\s+(\\w+)\\("
# use = "\\b(\\w+)\\s*\\("

[docs]
required = ["README.md"]
diagram_globs = []
diagram_render_ext = ".svg"
adr_dir = "docs/adr"
hooks_file = ".cursor/hooks.json"

[requirements]
source = ""
tables_from = ""
routes_from = "src/main/java"
views_from = ""

# 默认不跑。adone health --with-probes 才执行。服务得已经在跑。
